set -g default-command "${SHELL}"
set -g default-terminal "tmux-256color"
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title:RGB,screen*:title,rxvt*:ignorefkeys"
set -sg escape-time 0
set -g focus-events on
set -g mouse on
set -g status-position bottom

# Change prefix to Ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Switch panes using Option + Vim directions (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Move seamlessly between tmux panes and Neovim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | rg -iq '^[^TXZ ]+ +(.*/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Prefix + P launches a three-pane coding layout
bind P split-window -h \; split-window -v \; select-pane -t 0 \; send-keys 'nvim' C-m

# Prefix + T toggles shared light/dark theme
bind T run-shell "theme toggle"

# ====================================================================
# Catppuccin theme (matches Neovim light/dark via ~/.config/theme-mode)
# ====================================================================
if-shell '[ "$(cat "$HOME/.config/theme-mode" 2>/dev/null)" = dark ]' {
  set -g @catppuccin_flavor "mocha"
} {
  set -g @catppuccin_flavor "latte"
}

set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_number_color "#{@thm_pink}"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_pink}"
set -g @catppuccin_status_background "default"
set -g @catppuccin_reset "true"

# ====================================================================
# Plugins (TPM)
# ====================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Save: Ctrl-a then Ctrl-s; restore: Ctrl-a then Ctrl-r
run '~/.tmux/plugins/tpm/tpm'

# Apply Catppuccin after TPM installs/loads it, then build a simple status line.
if-shell '[ -f "$HOME/.tmux/plugins/tmux/catppuccin.tmux" ]' {
  run '~/.tmux/plugins/tmux/catppuccin.tmux'
  set -g status-left-length 100
  set -g status-right-length 100
  set -g status-left ""
  set -g status-right "#{E:@catppuccin_status_session}"
}
